<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cat & Dog Live Detector</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <main class="app-shell">
    <section class="header-card">
      <p class="eyebrow">YOLOv8 · Realtime Vision</p>
      <h1>Live Cat / Dog Detector</h1>
      <p class="subtext">Open your camera and detect cats or dogs in real time. Bounding boxes and confidence scores update continuously.</p>
    </section>

    <section class="viewer-card">
      <div class="video-stack">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
      </div>
      <div class="controls">
        <button id="startBtn">Start Camera</button>
        <button id="stopBtn" disabled>Stop</button>
        <span id="status" class="status">Idle</span>
      </div>
      <ul id="detections" class="detections"></ul>
    </section>
  </main>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
